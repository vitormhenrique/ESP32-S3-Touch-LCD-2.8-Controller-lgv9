; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32_tx_remote]
board = esp32-s3-devkitc-1 
framework = arduino
upload_speed = 921600
monitor_speed = 115200
upload_protocol = esp-builtin
; Pin upload/monitor to a specific ESP32-S3 USB-JTAG by its serial so multiple
; boards can be connected at once. Find the serial with `pio device list` or
; ioreg (USB Serial Number of "USB JTAG_serial debug unit").
upload_flags =
	-c
	adapter serial 30:ED:A0:AD:87:DC
monitor_port = hwgrep://30:ED:A0:AD:87:DC
board_build.arduino.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags = 
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=0
	; Enable performance monitoring (set to 1 to enable, 0 to disable)
	-DDEBUG_PERF=0
	; UI input simulation: drive RC channels from the touch UI instead of the
	; physical inputs (tap buttons/switches/toggles, drag gimbals).
	; Set to 1 to enable, 0 for normal hardware inputs.
	-DUI_INPUT_SIM=0
lib_deps = 
	lib/lvgl
	adafruit/Adafruit ADS1X15@^2.5.0
	adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
lib_extra_dirs = 
build_src_filter = +<*> +<../lib/lvgl/demos/music/assets/*.c> +<../lib/lvgl/demos/widgets/assets/img_lvgl_logo.c>
; Pinned to Arduino-ESP32 3.0.2 / ESP-IDF 5.1.4. The official PlatformIO
; espressif32 platform currently resolves to Arduino-ESP32 2.0.17 instead.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/2024.07.00/platform-espressif32.zip
