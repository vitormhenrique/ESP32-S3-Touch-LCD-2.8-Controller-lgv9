; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.arduino.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
build_flags = 
	-DBOARD_HAS_PSRAM
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	; Debug metrics - set to 1 to enable performance monitoring
	-D DEBUG_METRICS=0
lib_deps = 
	lib/lvgl
	adafruit/Adafruit ADS1X15@^2.5.0
	adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
lib_extra_dirs = 
build_src_filter = +<*> +<../lib/lvgl/demos/music/assets/*.c> +<../lib/lvgl/demos/widgets/assets/img_lvgl_logo.c>
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.34/platform-espressif32.zip

; Debug build with metrics enabled
[env:esp32-s3-devkitc-1-debug]
extends = env:esp32-s3-devkitc-1
build_flags = 
	${env:esp32-s3-devkitc-1.build_flags}
	-D DEBUG_METRICS=1
